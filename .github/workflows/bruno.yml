name: Toolshop API Pipeline

on:
  push:
    branches:
      - main
      - bruno-pipeline

  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install express js-yaml
          npm install -g @usebruno/cli

      - name: Verify Mock File
        run: |
          test -f mocks/stubs_full_website.yml
          test -f scripts/start-mock-server.js

      - name: Start Bruno YAML Mock Server
        run: |
          mkdir -p reports
          nohup node scripts/start-mock-server.js > reports/mock.log 2>&1 </dev/null &
          echo $! > mock.pid
          sleep 3

      - name: Verify Mock Server
        run: |
          cat reports/mock.log
          curl -f http://localhost:4001/brands

      - name: Run Bruno Collection
        run: |
          bru run --env mock --reporter-html reports/results.html

      - name: Stop Mock Server
        if: always()
        run: |
          kill $(cat mock.pid) || true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-report
          path: reports/results.html
