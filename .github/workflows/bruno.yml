name: Toolshop API Pipeline

on:
  push:
    branches:
      - main
      - bruno-pipeline

  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @usebruno/cli

      - name: Verify Mock File
        run: |
          ls -R
          test -f mocks/stubs_full_website.yml

      - name: Start Bruno YAML Mock Server
        run: |
          nohup node scripts/start-mock-server.js > mock.log 2>&1 </dev/null &
          sleep 5

      - name: Verify Mock Server
        run: |
          cat mock.log
          curl -v http://localhost:4001/brands

      - name: Run Bruno Collection
        run: |
          bru run --env mock --reporter-html results.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-report
          path: results.html

      - name: Upload Mock Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-server-log
          path: mock.log
