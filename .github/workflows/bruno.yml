name: Toolshop API Pipeline

on:
  push:
    branches:
      - main
      - bruno-pipeline

  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bruno CLI and Prism Mock Server
        run: |
          npm install -g @usebruno/cli
          npm install -g @stoplight/prism-cli

      - name: Verify OpenAPI File Exists
        run: |
          ls -la
          test -f openapi.json

      - name: Start Mock Server
        run: |
          prism mock openapi.json -p 4001 > prism.log 2>&1 &
          sleep 10

      - name: Verify Mock Server
        run: |
          cat prism.log
          curl -v http://localhost:4001

      - name: Run Bruno Collection
        run: |
          bru run --env mock --reporter-html results.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-report
          path: results.html

      - name: Upload Prism Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-log
          path: prism.log